# Build and deploy old.ranzlappen.com to GitHub Pages.
#
# There is no build step — the site is static HTML, CSS and JS committed as-is,
# which is the point of the archive. This workflow validates the tree, stages
# the parts that are actually the site, and uploads them.
#
# Jekyll is disabled by the .nojekyll file at the repo root, so underscore-
# prefixed paths and anything GitHub's Jekyll pass would otherwise rewrite are
# served verbatim.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      # Docs and meta never change what is served.
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/ci.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys queue rather than cancel, so a half-applied site is never published.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # tools/lint.mjs uses only Node builtins, so no install is needed here.
      # A dead link or a leaked credential must not reach production, so the
      # check CI runs on the PR runs again against what is about to deploy.
      - name: Validate the site
        run: npm run lint

      # Stage only what is served. The repo root also holds the test tooling
      # and its manifest, which have no business being published.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r assets projects _site/
          cp index.html about.html CNAME .nojekyll _site/
          # NOTES.md files sit beside each project and are linked from its
          # page, so they ship; everything else in the repo does not.
          echo "Staged $(find _site -type f | wc -l) files"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
