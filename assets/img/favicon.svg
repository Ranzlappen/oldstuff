<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="old.ranzlappen.com">
  <!-- The brand mark: a dark glassy tile carrying a glowing blue shield, from
       the same icon family as the rest of ranzlappen.com. The clock inside is
       this site's own emblem — the archive. tools/make-icon.py draws the same
       design as a PNG for the main site's footer favicon strip. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12243a"/>
      <stop offset="1" stop-color="#0a121d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <path d="M32 9 L51 16 v18c0 12-9 19-19 23-10-4-19-11-19-23V16Z"
        fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round" opacity="0.55"/>
  <circle cx="32" cy="29" r="11" fill="none" stroke="#3b82f6" stroke-width="2.6"/>
  <path d="M32 29 L25.5 24.5 M32 29 L34.5 23.5" stroke="#7dd3fc" stroke-width="2.8"
        stroke-linecap="round"/>
  <circle cx="32" cy="29" r="1.8" fill="#7dd3fc"/>
</svg>
